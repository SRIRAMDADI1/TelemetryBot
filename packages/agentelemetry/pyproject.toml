[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentelemetry"
version = "0.1.0"
description = "Agent observability SDK for TelemetryBot — traces, tokens, and cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agentelemetry-demo = "agentelemetry.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["agentelemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
