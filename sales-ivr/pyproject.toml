[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-ivr"
version = "0.1.0"
description = "Sales IVR platform for insurance companies (base scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
sales-ivr = "sales_ivr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sales_ivr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
