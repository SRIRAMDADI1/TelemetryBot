[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetrybot-cli"
version = "0.1.0"
description = "TelemetryBot CLI — connect, scan, list projects"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]
# Requires: pip install -e ../packages/agentelemetry


[project.scripts]
telemetry = "telemetry_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["telemetry_cli"]
